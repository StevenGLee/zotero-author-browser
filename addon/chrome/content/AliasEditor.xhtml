<?xml version="1.0"?>
<!-- prettier-ignore -->
<?xml-stylesheet href="chrome://global/skin/" type="text/css"?>
<!-- prettier-ignore -->
<?xml-stylesheet href="chrome://zotero/skin/zotero.css" type="text/css"?>
<!-- prettier-ignore -->
<?xml-stylesheet href="chrome://zotero-platform/content/zotero-react-client.css" type="text/css"?>
<!-- prettier-ignore -->
<?xml-stylesheet href="chrome://zotero-platform/content/zotero.css" type="text/css"?>
<!-- prettier-ignore -->
<!DOCTYPE html>
<html
  id="__addonRef__-aliasEditor"
  lang="en"
  xmlns="http://www.w3.org/1999/xhtml"
  xmlns:xul="http://www.mozilla.org/keymaster/gatekeeper/there.is.only.xul"
  xmlns:html="http://www.w3.org/1999/xhtml"
  windowtype="__addonRef__-aliasEditor"
  sizemode="normal"
  scrolling="false"
  persist="screenX screenY width height sizemode"
>
  <head>
    <title data-l10n-id="title"></title>
    <meta charset="utf-8" />
    <xul:linkset>
      <link rel="localization" href="browser/menubar.ftl" />
      <link rel="localization" href="browser/browserSets.ftl" />
      <link rel="localization" href="toolkit/global/textActions.ftl" />
      <link rel="localization" href="zotero.ftl" />
      <link rel="localization" href="__addonRef__-aliasEditor.ftl" />
    </xul:linkset>
    <xul:commandset id="mainCommandSet">
      <xul:command id="cmd_close" oncommand="window.close();" />
    </xul:commandset>
    <xul:keyset id="mainKeyset">
      <xul:key
        id="key_close"
        data-l10n-id="close-shortcut"
        command="cmd_close"
        modifiers="accel"
        reserved="true"
      />
    </xul:keyset>
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const scriptLoader = Components.classes[
          "@mozilla.org/moz/jssubscript-loader;1"
        ].getService(Components.interfaces.mozIJSSubScriptLoader);
        scriptLoader.loadSubScript("chrome://zotero/content/include.js", this);
        window.arguments[0]._initPromise.resolve();
      });
    </script>
    <style>
      html,
      body {
        min-width: 1024px;
        min-height: 560px;
      }

      html,
      body {
        padding: 0;
        margin: 0;
        height: 100%;
        overflow: hidden;
        word-wrap: break-word;
        user-select: none;
      }

      #main-info {
        box-sizing: border-box;
        height: 40px;
        padding: 10px;
        display: flex;
        align-items: center;
        border-bottom: 1px solid var(--color-border-secondary);
      }

      #current-main-name {
        margin-left: 8px;
        font-weight: 600;
      }

      .viewport-container {
        box-sizing: border-box;
        padding: 10px;
        margin: 0;
        height: calc(100% - 136px);
        width: 100%;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
        overflow: hidden;
        background: var(--material-background);
      }

      .panel {
        display: flex;
        flex-direction: column;
        border: 1px solid var(--color-border-secondary);
        border-radius: 6px;
        min-width: 0;
      }

      .panel-title {
        margin: 0;
        padding: 8px 10px;
        font-size: 13px;
        border-bottom: 1px solid var(--color-border-secondary);
      }

      .table-container {
        flex: 1;
        min-height: 0;
        overflow: hidden;
      }

      #action-message {
        min-width: 220px;
        margin-left: 10px;
        font-size: 12px;
        color: var(--color-text-secondary);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
    </style>
  </head>
  <body class="zotero-window">
    <div id="main-info">
      <span data-l10n-id="current-main-label"></span>
      <span id="current-main-name"></span>
    </div>
    <div class="viewport-container">
      <section class="panel">
        <h2 class="panel-title" data-l10n-id="current-aliases-title"></h2>
        <div id="current-alias-table-container" class="table-container"></div>
      </section>
      <section class="panel">
        <h2 class="panel-title" data-l10n-id="suggested-aliases-title"></h2>
        <div id="suggested-table-container" class="table-container"></div>
      </section>
    </div>
    <div
      class="footer-container"
      style="justify-content: flex-start; padding: 10px"
      xmlns="http://www.mozilla.org/keymaster/gatekeeper/there.is.only.xul"
    >
      <button
        id="add-selected-suggestions"
        data-l10n-id="add-selected-suggestions"
      ></button>
      <button id="add-all-suggestions" data-l10n-id="add-all-suggestions"></button>
      <button
        id="add-browser-selection"
        data-l10n-id="add-browser-selection"
      ></button>
      <button
        id="restore-selected-aliases"
        data-l10n-id="restore-selected-aliases"
      ></button>
      <button id="refresh" data-l10n-id="refresh"></button>
      <button id="close" data-l10n-id="close"></button>
      <html:div id="action-message"></html:div>
    </div>
  </body>
</html>
